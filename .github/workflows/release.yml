name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - label: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            experimental: true
          - label: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - label: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
          - label: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Test
        if: matrix.target != 'x86_64-unknown-linux-musl'
        run: cargo test --release --locked
      - name: Build GUI and CLI
        run: cargo build --release --locked --target ${{ matrix.target }} --bins
      - name: Stage executables (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/folder-history" dist/
          cp "target/${{ matrix.target }}/release/folder-history-cli" dist/
      - name: Stage executables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/folder-history.exe" dist/
          Copy-Item "target/${{ matrix.target }}/release/folder-history-cli.exe" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: folder-history-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Package and publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: folder-history-*
          path: artifacts
      - name: Package platform archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          for dir in artifacts/folder-history-*; do
            [ -d "$dir" ] || continue
            name="${dir##*/}"
            if [[ "$name" == *windows* ]]; then
              (cd "$dir" && zip -q "../../releases/${name}.zip" ./*)
            else
              tar -czf "releases/${name}.tar.gz" -C "$dir" .
            fi
          done
          (cd releases && sha256sum * > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" releases/* --generate-notes --verify-tag
