[package]
name = "folder-history"
version = "0.2.1"
edition = "2024"
authors = ["Stefan Lang"]
description = "Offline research folder history, search, and provenance explorer"
license = "MIT"

[dependencies]
eframe = "0.33"
rfd = "0.15"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2.5"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.12"
anyhow = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true


[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[features]
dev-tools = []

[[bin]]
name = "regen-readme"
path = "src/bin/regen-readme.rs"
